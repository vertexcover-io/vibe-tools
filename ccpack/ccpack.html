<!DOCTYPE html>
<!-- AI-generated. See PROMPT.md for the prompts and model used. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccpack</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #fff; --line: #e4e2dd; --ink: #24221e; --soft: #78736b;
  --accent: #b4532a; --tool: #8d8880; --code: #f2f0ec; --hover: #f3f1ed;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17171a; --panel: #1e1e22; --line: #2e2e34; --ink: #e8e6e1; --soft: #9a958d;
    --accent: #e08a5e; --tool: #7c776f; --code: #26262b; --hover: #26262b;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; height: 100vh; display: grid; grid-template-columns: 380px 1fr;
  background: var(--bg); color: var(--ink);
  font: 14px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
}
aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.search { padding: 14px; border-bottom: 1px solid var(--line); }
.search input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: inherit; font: inherit; outline: none;
}
.search input:focus { border-color: var(--accent); }
.count { padding: 8px 16px; font-size: 12px; color: var(--soft); }
#list { overflow-y: auto; flex: 1; min-height: 0; }
.item { padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--hover); }
.item.on { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
.item .top { display: flex; gap: 8px; font-size: 12px; color: var(--soft); }
.item .proj { color: var(--accent); font-weight: 600; }
.item .name { margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
header {
  padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
  display: flex; align-items: center; gap: 16px;
}
header h1 { margin: 0; font-size: 16px; font-weight: 600; }
header .meta { font-size: 12px; color: var(--soft); margin-top: 3px; word-break: break-all; }
header .grow { flex: 1; min-width: 0; }
button {
  padding: 8px 16px; border: 1px solid var(--accent); border-radius: 8px; cursor: pointer;
  background: var(--accent); color: #fff; font: inherit; font-weight: 600; white-space: nowrap;
}
button:disabled { opacity: .4; cursor: default; }
#chat { overflow-y: auto; padding: 24px; flex: 1; min-height: 0; }
.msg { max-width: 820px; margin: 0 auto 22px; }
.who { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.you .who { color: var(--accent); }
.claude .who { color: var(--soft); }
.body { margin-top: 5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tool {
  max-width: 820px; margin: 0 auto 10px; font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 12px; color: var(--tool); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
pre {
  background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto;
  font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; margin: 8px 0;
}
.empty { color: var(--soft); text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<aside>
  <div class="search"><input id="q" type="search" placeholder="Filter sessions…" autofocus></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</aside>
<main>
  <header>
    <div class="grow"><h1 id="title">ccpack</h1><div class="meta" id="meta">Pick a session on the left.</div></div>
    <button id="dl" disabled>Download zip</button>
  </header>
  <div id="chat"><div class="empty">Loading sessions…</div></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let sessions = [], shown = [], current = null;

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const day = (iso) => iso.slice(0, 10);

function fences(text) {
  return text
    .split(/```/)
    .map((part, i) => (i % 2 ? `<pre>${esc(part.replace(/^\w*\n/, ""))}</pre>` : esc(part)))
    .join("");
}

function matches(s, needle) {
  const hay = `${s.id} ${s.project} ${s.cwd} ${s.title}`.toLowerCase();
  return needle.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}

function drawList() {
  $("count").textContent = `${shown.length} of ${sessions.length} sessions`;
  $("list").innerHTML = shown
    .map(
      (s) => `<div class="item${s.id === current ? " on" : ""}" data-id="${s.id}">
        <div class="top"><span>${day(s.updated)}</span><span class="proj">${esc(s.project)}</span></div>
        <div class="name">${esc(s.title)}</div>
      </div>`
    )
    .join("");
}

async function open(id) {
  current = id;
  drawList();
  $("chat").innerHTML = '<div class="empty">Reading transcript…</div>';
  const res = await fetch(`/api/session/${id}`);
  if (!res.ok) { $("chat").innerHTML = '<div class="empty">Could not read that session.</div>'; return; }
  const data = await res.json();
  $("title").textContent = data.title;
  $("meta").textContent = `${data.cwd}${data.branch ? "  ·  " + data.branch : ""}  ·  ${data.id}`;
  $("dl").disabled = false;
  $("chat").innerHTML = data.messages.length
    ? data.messages
        .map((m) =>
          m.role === "tool"
            ? `<div class="tool">→ ${esc(m.text)}</div>`
            : `<div class="msg ${m.role}"><div class="who">${m.role === "you" ? "You" : "Claude"}${
                m.at ? " · " + m.at : ""
              }</div><div class="body">${fences(m.text)}</div></div>`
        )
        .join("")
    : '<div class="empty">No messages in this session.</div>';
  $("chat").scrollTop = 0;
}

function move(step) {
  const at = shown.findIndex((s) => s.id === current);
  const next = shown[Math.min(Math.max(at + step, 0), shown.length - 1)];
  if (next && next.id !== current) open(next.id);
}

$("list").addEventListener("click", (e) => {
  const item = e.target.closest(".item");
  if (item) open(item.dataset.id);
});
$("q").addEventListener("input", () => {
  shown = sessions.filter((s) => matches(s, $("q").value));
  drawList();
});
$("dl").addEventListener("click", () => { if (current) location.href = `/api/zip/${current}`; });
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});

(async () => {
  sessions = await (await fetch("/api/sessions")).json();
  shown = sessions;
  drawList();
  if (sessions.length) open(sessions[0].id);
  else $("chat").innerHTML = '<div class="empty">No sessions found.</div>';
})();
</script>
</body>
</html>
